<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#10091f">
<title>WHAT HAPPENS IF?</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#10091f;
 color:white;
 font-family:Arial,sans-serif;
}
header{
 padding:24px 7%;
 border-bottom:1px solid #302044;
}
.logo{
 font-size:21px;
 font-weight:900;
 color:#c4a0ff;
}
main{
 max-width:900px;
 margin:65px auto;
 padding:20px;
}
.tag{
 color:#b58aff;
 font-size:12px;
 letter-spacing:3px;
 font-weight:bold;
}
h1{
 font-size:clamp(38px,8vw,65px);
 margin:18px 0;
}
h1 span{color:#b58aff}
.subtitle{
 color:#b9aecb;
 line-height:1.7;
}
.search{
 display:flex;
 gap:10px;
 flex-wrap:wrap;
 margin-top:30px;
}
input{
 flex:1;
 min-width:200px;
 padding:17px;
 border-radius:12px;
 border:1px solid #684c91;
 background:#211633;
 color:white;
 font-size:16px;
}
button{
 padding:16px 23px;
 border:0;
 border-radius:10px;
 background:#9860ee;
 color:white;
 font-weight:bold;
 cursor:pointer;
}
h2{font-size:23px}
#result{
 display:none;
 margin-top:30px;
 padding:25px;
 background:#211633;
 border:1px solid #684c91;
 border-radius:15px;
 line-height:1.8;
}
#suggestions{
 display:flex;
 flex-wrap:wrap;
 gap:10px;
 margin-top:20px;
}
.suggestion{
 background:#25183a;
 border:1px solid #493367;
 padding:12px 15px;
 border-radius:20px;
 color:#d9c7f4;
 cursor:pointer;
}
footer{
 text-align:center;
 color:#776b8c;
 padding:40px;
}
small{color:#b58aff}
</style>
</head>

<body>

<header>
 <div class="logo">✦ WHAT HAPPENS IF?</div>
</header>

<main>

 <div class="tag">EXPLORE THE IMPOSSIBLE</div>

 <h1>What happens <span>if...</span></h1>

 <p class="subtitle">
 Ask anything. Explore science, space, technology,
 nature and the mysteries of our universe.
 </p>

 <div class="search">
  <input id="question"
  placeholder="Ask your question...">
  <button onclick="explore()">Explore →</button>
 </div>

 <h2>Popular questions</h2>

 <div id="suggestions">
  <button class="suggestion" onclick="ask('What if the Moon disappeared?')">🌙 Moon disappears</button>
  <button class="suggestion" onclick="ask('What if the Sun disappeared?')">☀️ Sun disappears</button>
  <button class="suggestion" onclick="ask('What if Earth stopped rotating?')">🌍 Earth stops</button>
  <button class="suggestion" onclick="ask('What is a black hole?')">🕳️ Black holes</button>
  <button class="suggestion" onclick="ask('Why do we dream?')">💭 Dreams</button>
  <button class="suggestion" onclick="ask('What if gravity disappeared?')">🪐 Gravity</button>
  <button class="suggestion" onclick="ask('How deep is the ocean?')">🌊 Oceans</button>
  <button class="suggestion" onclick="ask('What if dinosaurs survived?')">🦖 Dinosaurs</button>
  <button class="suggestion" onclick="ask('Can humans live on Mars?')">🚀 Mars</button>
  <button class="suggestion" onclick="ask('Why is the sky blue?')">🔵 Blue sky</button>
 </div>

 <div id="result"></div>

</main>

<footer>
 WHAT HAPPENS IF? · Explore the unknown.
</footer>

<script>
const API_URL = "https://hello-ai.clasav278.workers.dev";

async function ask(question) {
  document.getElementById("question").value = question;
  await explore();
}

async function explore() {
  const input = document.getElementById("question");
  const button = document.querySelector(".search button");
  const question = input.value.trim();
  const result = document.getElementById("result");

  if (!question) {
    alert("Please enter a question!");
    return;
  }

  result.style.display = "block";
  result.replaceChildren();

  const title = document.createElement("h2");
  const paragraph = document.createElement("p");
  const label = document.createElement("small");

  title.textContent = "🔭 Thinking...";
  paragraph.textContent = "Finding an answer to your question.";
  label.textContent = "WHAT HAPPENS IF? · AI";
  result.append(title, paragraph, label);
  result.scrollIntoView({ behavior: "smooth", block: "nearest" });

  button.disabled = true;
  button.textContent = "Thinking...";

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "The AI request failed.");
    }

    const answer =
      data?.choices?.[0]?.message?.content ||
      data?.response ||
      data?.result ||
      "";

    if (!answer) {
      throw new Error("The AI returned an empty answer. Please try again.");
    }

    title.textContent = "✨ Here's what happens";
    paragraph.textContent = answer;
    label.textContent = "WHAT HAPPENS IF? · Powered by AI";
  } catch (error) {
    title.textContent = "⚠️ We couldn't get an answer";
    paragraph.textContent = error.message.includes("Failed to fetch")
      ? "The connection to the AI is blocked or unavailable. Please try again later."
      : error.message;
    label.textContent = "WHAT HAPPENS IF? · Connection notice";
  } finally {
    button.disabled = false;
    button.textContent = "Explore →";
  }
}

document.getElementById("question").addEventListener("keydown", function(event) {
  if (event.key === "Enter") explore();
});
</script>

</body>
</html>
